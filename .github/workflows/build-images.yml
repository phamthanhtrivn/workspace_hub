name: Build Docker images
'on':
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      matrix:
        required: true
        type: string
permissions:
  contents: read
jobs:
  images:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate public release configuration
        if: ${{ inputs.publish }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_NOMINATIM_URL: ${{ vars.NEXT_PUBLIC_NOMINATIM_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          test -n "$NEXT_PUBLIC_NOMINATIM_URL"
      - name: Login to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reuse an existing immutable release image
        id: existing
        if: ${{ inputs.publish }}
        env:
          IMAGE: ${{ format('{0}/workspacehub-{1}:sha-{2}', vars.DOCKERHUB_USERNAME, matrix.name, github.sha) }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: ${{ steps.existing.outputs.found != 'true' }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ inputs.publish }}
          tags: ${{ format('{0}/workspacehub-{1}:sha-{2}', vars.DOCKERHUB_USERNAME || 'workspacehub-ci', matrix.name, github.sha) }}
          cache-from: ${{ format('type=gha,scope={0}', matrix.name) }}
          cache-to: ${{ format('type=gha,mode=max,scope={0}', matrix.name) }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'ci-placeholder' }}
            NEXT_PUBLIC_NOMINATIM_URL=${{ vars.NEXT_PUBLIC_NOMINATIM_URL || 'https://nominatim.openstreetmap.org' }}
            NEXT_PUBLIC_ASSET_HOST=${{ vars.NEXT_PUBLIC_ASSET_HOST }}
            SITE_URL=
            SITE_INDEXABLE=false
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate public release configuration
        if: ${{ inputs.publish }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_NOMINATIM_URL: ${{ vars.NEXT_PUBLIC_NOMINATIM_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          test -n "$NEXT_PUBLIC_NOMINATIM_URL"
      - name: Login to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reuse an existing immutable release image
        id: existing
        if: ${{ inputs.publish }}
        env:
          IMAGE: ${{ format('{0}/workspacehub-{1}:sha-{2}', vars.DOCKERHUB_USERNAME, matrix.name, github.sha) }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: ${{ steps.existing.outputs.found != 'true' }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ inputs.publish }}
          tags: ${{ format('{0}/workspacehub-{1}:sha-{2}', vars.DOCKERHUB_USERNAME || 'workspacehub-ci', matrix.name, github.sha) }}
          cache-from: ${{ format('type=gha,scope={0}', matrix.name) }}
          cache-to: ${{ format('type=gha,mode=max,scope={0}', matrix.name) }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'ci-placeholder' }}
            NEXT_PUBLIC_NOMINATIM_URL=${{ vars.NEXT_PUBLIC_NOMINATIM_URL || 'https://nominatim.openstreetmap.org' }}
            NEXT_PUBLIC_ASSET_HOST=${{ vars.NEXT_PUBLIC_ASSET_HOST }}
            SITE_URL=${{ vars.SITE_URL }}
            SITE_INDEXABLE=${{ vars.SITE_INDEXABLE || 'false' }}
