name: Release production
'on':
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: workspacehub-production-app
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  build:
    needs: ci
    uses: ./.github/workflows/build-images.yml
    with:
      publish: true
    secrets: inherit
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy through SSH/SCP and wait for health
        env:
          SSH_HOST: ${{ vars.APP_SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: python3 deploy/scripts/send-deployment.py app "$GITHUB_SHA"
    needs: build
