name: Release production
'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Target deployment scope (auto detects from host baselines)'
        type: choice
        options:
          - auto
          - app
          - infra
          - realtime
        default: auto
      services:
        description: 'auto, all, or comma-separated Compose services (for example calendar-service,frontend-web,ai-service)'
        type: string
        default: auto
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/production-coordinator.yml
    with:
      scope: ${{ github.event_name == 'push' && 'auto' || inputs.scope || 'auto' }}
      services: ${{ inputs.services || 'auto' }}
    secrets: inherit
