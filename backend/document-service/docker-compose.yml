version: '3.8'

services:
  document-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wh_document_service
    container_name: wh_document_service
    ports:
      - "8085:8085"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8085"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - wh_network
    restart: on-failure
