version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspace_hub_user_service
    ports:
      - "8081:8081"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure
