version: '3.8'

services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wh_notification_service
    container_name: wh_notification_service
    ports:
      - "8084:8084"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/ready >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 30s
    networks:
      - wh_network
    restart: on-failure
