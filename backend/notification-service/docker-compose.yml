version: '3.8'

services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wh_notification_service
    container_name: wh_notification_service
    ports:
      - "8084:8084"
    env_file:
      - .env.docker
    environment:
      PROJECT_NOTIFICATION_MAX_RETRIES: ${PROJECT_NOTIFICATION_MAX_RETRIES:-3}
      PROJECT_NOTIFICATION_RETRY_BASE_DELAY_MS: ${PROJECT_NOTIFICATION_RETRY_BASE_DELAY_MS:-1000}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8084"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - wh_network
    restart: on-failure
