version: '3.8'

services:
  communication-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wh_communication_service
    container_name: wh_communication_service
    ports:
      - "8083:8083"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8083"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - wh_network
    restart: on-failure
