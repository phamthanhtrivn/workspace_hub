      LLM_INTERACTIVE_RESERVE_PER_DAY: ${LLM_INTERACTIVE_RESERVE_PER_DAY:-50}
  notebook-db-init:
    image: postgres:15.18-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    environment:
      PGHOST: postgres
      PGUSER: ${NOTEBOOK_POSTGRES_USER:?NOTEBOOK_POSTGRES_USER is required}
      PGPASSWORD: ${NOTEBOOK_POSTGRES_PASSWORD:?NOTEBOOK_POSTGRES_PASSWORD is required}
    entrypoint:
      - sh
      - /ensure-database.sh
    volumes:
      - ./ensure-database.sh:/ensure-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wh_network
    restart: "no"
volumes:
  notebook-qdrant:
    name: wh-notebook_notebook-qdrant
  notebook-models:
    name: wh-notebook_notebook-models
