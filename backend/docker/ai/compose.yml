x-logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
services:
  notebook-qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - notebook-qdrant:/qdrant/storage
    restart: unless-stopped
    networks:
      - ai_internal
  rag-worker:
    build: ../../ai-service/rag-worker
    environment:
      RAG_SERVICE_KEY: ${RAG_SERVICE_KEY:?Configure dedicated RAG credentials first}
      RAG_SERVICE_KEY_PREVIOUS: ${RAG_SERVICE_KEY_PREVIOUS:-}
      QDRANT_URL: ${QDRANT_URL:-http://notebook-qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_SECONDARY_MODEL: ${EMBEDDING_SECONDARY_MODEL:-}
      EMBEDDING_LOCAL_ENABLED: ${EMBEDDING_LOCAL_ENABLED:-false}
      EMBEDDING_INDEX_STRATEGY: ${EMBEDDING_INDEX_STRATEGY:-ensemble}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      INDEX_PIPELINE_VERSION: ${INDEX_PIPELINE_VERSION:-notebook-v1}
      VISUAL_ENABLED: ${VISUAL_ENABLED:-false}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
    volumes:
      - notebook-models:/models
    depends_on:
      - notebook-qdrant
    restart: unless-stopped
    mem_limit: ${RAG_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - >-
          import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8088/ready',headers={'x-internal-service-key':os.environ['RAG_SERVICE_KEY']});
          urllib.request.urlopen(r,timeout=10).close()
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 180s
    networks:
      - ai_internal
  speech-worker:
    build: ../../ai-service/speech-worker
    environment:
      SPEECH_SERVICE_KEY: ${MEETING_STT_SERVICE_KEY:-}
      STT_MODEL_PATH: /models/small
      STT_CPU_THREADS: ${MEETING_STT_CPU_THREADS:-4}
      HF_HUB_OFFLINE: "1"
    expose:
      - "8090"
    restart: unless-stopped
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - >-
          import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8090/ready',headers={'x-internal-service-key':os.environ['SPEECH_SERVICE_KEY']});
          urllib.request.urlopen(r,timeout=5).close()
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    networks:
      - ai_internal
  migrate:
    build: ../../ai-service/api
    command:
      - node
      - dist/migrate.js
    networks:
      - ai_internal
      - wh_network
    restart: "no"
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL:-}
      AI_TO_USER_KEY: ${AI_TO_USER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-workspace-hub}
      MEETING_STT_URL: ${MEETING_STT_URL:-}
      MEETING_STT_SERVICE_KEY: ${MEETING_STT_SERVICE_KEY:-}
      MEETING_STT_TIMEOUT_MS: ${MEETING_STT_TIMEOUT_MS:-180000}
      MEETING_SUMMARY_ENABLED: ${MEETING_SUMMARY_ENABLED:-false}
      VOICE_TRANSCRIPTION_ENABLED: ${VOICE_TRANSCRIPTION_ENABLED:-${MEETING_SUMMARY_ENABLED:-false}}
      MEETING_SUMMARY_MAX_SECONDS: ${MEETING_SUMMARY_MAX_SECONDS:-7200}
      MEETING_SUMMARY_MAX_BYTES: ${MEETING_SUMMARY_MAX_BYTES:-1073741824}
      MEETING_FFMPEG_PATH: ${MEETING_FFMPEG_PATH:-ffmpeg}
      MEETING_MEDIA_HOSTS: ${MEETING_MEDIA_HOSTS:-}
      CONVERSATION_AI_ENABLED: ${CONVERSATION_AI_ENABLED:-false}
      CONVERSATION_AI_CONCURRENCY: ${CONVERSATION_AI_CONCURRENCY:-2}
      LLM_QUOTA_WAIT_MS: ${LLM_QUOTA_WAIT_MS:-60000}
      CONVERSATION_AI_MODEL: ${CONVERSATION_AI_MODEL:-${LLM_MODEL}}
      CONVERSATION_AI_MAX_TOKENS: ${CONVERSATION_AI_MAX_TOKENS:-${LLM_MAX_TOKENS:-4096}}
      WORK_ASSISTANT_MODEL: ${WORK_ASSISTANT_MODEL:-${LLM_MODEL}}
      WORK_ASSISTANT_MAX_TOKENS: ${WORK_ASSISTANT_MAX_TOKENS:-1800}
      MEETING_SUMMARY_MODEL: ${MEETING_SUMMARY_MODEL:-${LLM_MODEL}}
      MEETING_SUMMARY_MAX_TOKENS: ${MEETING_SUMMARY_MAX_TOKENS:-${LLM_MAX_TOKENS:-4096}}
      AI_TO_COMMUNICATION_KEY: ${AI_TO_COMMUNICATION_KEY:-}
      COMMUNICATION_TO_AI_KEY: ${COMMUNICATION_TO_AI_KEY:-}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL:-}
      WORK_ASSISTANT_ENABLED: ${WORK_ASSISTANT_ENABLED:-false}
      AI_TO_PROJECT_KEY: ${AI_TO_PROJECT_KEY:-}
      AI_TO_CALENDAR_KEY: ${AI_TO_CALENDAR_KEY:-}
      WORK_ASSISTANT_PROJECT_URL: ${WORK_ASSISTANT_PROJECT_URL:-}
      WORK_ASSISTANT_CALENDAR_URL: ${WORK_ASSISTANT_CALENDAR_URL:-}
      PORT: ${PORT:-8087}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_SHUTDOWN_TIMEOUT_MS: ${AI_SHUTDOWN_TIMEOUT_MS:-210000}
      CHAT_CANCEL_POLL_MS: ${CHAT_CANCEL_POLL_MS:-2000}
      NODE_ENV: ${NODE_ENV:-development}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NOTEBOOK_INDEX_CONCURRENCY: ${NOTEBOOK_INDEX_CONCURRENCY:-1}
      NOTEBOOK_INDEX_TIMEOUT_MS: ${NOTEBOOK_INDEX_TIMEOUT_MS:-240000}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      AI_GATEWAY_KEY_PREVIOUS: ${AI_GATEWAY_KEY_PREVIOUS:-}
      AI_DOCUMENT_SERVICE_KEY: ${AI_DOCUMENT_SERVICE_KEY:-}
      RAG_SERVICE_KEY: ${RAG_SERVICE_KEY:-}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:?DOCUMENT_SERVICE_URL is required}
      RAG_WORKER_URL: ${RAG_WORKER_URL:?RAG_WORKER_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      VISUAL_ENABLED: ${VISUAL_ENABLED:-false}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-2048}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-3}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-5}
      LLM_TOKENS_PER_MINUTE: ${LLM_TOKENS_PER_MINUTE:-20000}
      LLM_REQUESTS_PER_DAY: ${LLM_REQUESTS_PER_DAY:-100}
      LLM_INTERACTIVE_RESERVE_PER_DAY: ${LLM_INTERACTIVE_RESERVE_PER_DAY:-50}
    depends_on:
      notebook-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  notebook-api:
    build: ../../ai-service/api
    stop_grace_period: 4m
    ports:
      - 127.0.0.1:8087:8087
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ai_internal
      - wh_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-worker:
        condition: service_healthy
      speech-worker:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - >-
          fetch('http://127.0.0.1:8087/ready',{signal:AbortSignal.timeout(8000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL:-}
      AI_TO_USER_KEY: ${AI_TO_USER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-workspace-hub}
      MEETING_STT_URL: ${MEETING_STT_URL:-}
      MEETING_STT_SERVICE_KEY: ${MEETING_STT_SERVICE_KEY:-}
      MEETING_STT_TIMEOUT_MS: ${MEETING_STT_TIMEOUT_MS:-180000}
      MEETING_SUMMARY_ENABLED: ${MEETING_SUMMARY_ENABLED:-false}
      VOICE_TRANSCRIPTION_ENABLED: ${VOICE_TRANSCRIPTION_ENABLED:-${MEETING_SUMMARY_ENABLED:-false}}
      MEETING_SUMMARY_MAX_SECONDS: ${MEETING_SUMMARY_MAX_SECONDS:-7200}
      MEETING_SUMMARY_MAX_BYTES: ${MEETING_SUMMARY_MAX_BYTES:-1073741824}
      MEETING_FFMPEG_PATH: ${MEETING_FFMPEG_PATH:-ffmpeg}
      MEETING_MEDIA_HOSTS: ${MEETING_MEDIA_HOSTS:-}
      CONVERSATION_AI_ENABLED: ${CONVERSATION_AI_ENABLED:-false}
      CONVERSATION_AI_CONCURRENCY: ${CONVERSATION_AI_CONCURRENCY:-2}
      LLM_QUOTA_WAIT_MS: ${LLM_QUOTA_WAIT_MS:-60000}
      CONVERSATION_AI_MODEL: ${CONVERSATION_AI_MODEL:-${LLM_MODEL}}
      CONVERSATION_AI_MAX_TOKENS: ${CONVERSATION_AI_MAX_TOKENS:-${LLM_MAX_TOKENS:-4096}}
      WORK_ASSISTANT_MODEL: ${WORK_ASSISTANT_MODEL:-${LLM_MODEL}}
      WORK_ASSISTANT_MAX_TOKENS: ${WORK_ASSISTANT_MAX_TOKENS:-1800}
      MEETING_SUMMARY_MODEL: ${MEETING_SUMMARY_MODEL:-${LLM_MODEL}}
      MEETING_SUMMARY_MAX_TOKENS: ${MEETING_SUMMARY_MAX_TOKENS:-${LLM_MAX_TOKENS:-4096}}
      AI_TO_COMMUNICATION_KEY: ${AI_TO_COMMUNICATION_KEY:-}
      COMMUNICATION_TO_AI_KEY: ${COMMUNICATION_TO_AI_KEY:-}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL:-}
      WORK_ASSISTANT_ENABLED: ${WORK_ASSISTANT_ENABLED:-false}
      AI_TO_PROJECT_KEY: ${AI_TO_PROJECT_KEY:-}
      AI_TO_CALENDAR_KEY: ${AI_TO_CALENDAR_KEY:-}
      WORK_ASSISTANT_PROJECT_URL: ${WORK_ASSISTANT_PROJECT_URL:-}
      WORK_ASSISTANT_CALENDAR_URL: ${WORK_ASSISTANT_CALENDAR_URL:-}
      PORT: ${PORT:-8087}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_SHUTDOWN_TIMEOUT_MS: ${AI_SHUTDOWN_TIMEOUT_MS:-210000}
      CHAT_CANCEL_POLL_MS: ${CHAT_CANCEL_POLL_MS:-2000}
      NODE_ENV: ${NODE_ENV:-development}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NOTEBOOK_INDEX_CONCURRENCY: ${NOTEBOOK_INDEX_CONCURRENCY:-1}
      NOTEBOOK_INDEX_TIMEOUT_MS: ${NOTEBOOK_INDEX_TIMEOUT_MS:-240000}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      AI_GATEWAY_KEY_PREVIOUS: ${AI_GATEWAY_KEY_PREVIOUS:-}
      AI_DOCUMENT_SERVICE_KEY: ${AI_DOCUMENT_SERVICE_KEY:-}
      RAG_SERVICE_KEY: ${RAG_SERVICE_KEY:-}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:?DOCUMENT_SERVICE_URL is required}
      RAG_WORKER_URL: ${RAG_WORKER_URL:?RAG_WORKER_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      VISUAL_ENABLED: ${VISUAL_ENABLED:-false}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-2048}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-3}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-5}
      LLM_TOKENS_PER_MINUTE: ${LLM_TOKENS_PER_MINUTE:-20000}
      LLM_REQUESTS_PER_DAY: ${LLM_REQUESTS_PER_DAY:-100}
      LLM_INTERACTIVE_RESERVE_PER_DAY: ${LLM_INTERACTIVE_RESERVE_PER_DAY:-50}
  notebook-jobs:
    build: ../../ai-service/api
    command:
      - node
      - dist/worker.js
    stop_grace_period: 4m
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ai_internal
      - wh_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-worker:
        condition: service_healthy
      speech-worker:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL:-}
      AI_TO_USER_KEY: ${AI_TO_USER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-workspace-hub}
      MEETING_STT_URL: ${MEETING_STT_URL:-}
      MEETING_STT_SERVICE_KEY: ${MEETING_STT_SERVICE_KEY:-}
      MEETING_STT_TIMEOUT_MS: ${MEETING_STT_TIMEOUT_MS:-180000}
      MEETING_SUMMARY_ENABLED: ${MEETING_SUMMARY_ENABLED:-false}
      VOICE_TRANSCRIPTION_ENABLED: ${VOICE_TRANSCRIPTION_ENABLED:-${MEETING_SUMMARY_ENABLED:-false}}
      MEETING_SUMMARY_MAX_SECONDS: ${MEETING_SUMMARY_MAX_SECONDS:-7200}
      MEETING_SUMMARY_MAX_BYTES: ${MEETING_SUMMARY_MAX_BYTES:-1073741824}
      MEETING_FFMPEG_PATH: ${MEETING_FFMPEG_PATH:-ffmpeg}
      MEETING_MEDIA_HOSTS: ${MEETING_MEDIA_HOSTS:-}
      CONVERSATION_AI_ENABLED: ${CONVERSATION_AI_ENABLED:-false}
      CONVERSATION_AI_CONCURRENCY: ${CONVERSATION_AI_CONCURRENCY:-2}
      LLM_QUOTA_WAIT_MS: ${LLM_QUOTA_WAIT_MS:-60000}
      CONVERSATION_AI_MODEL: ${CONVERSATION_AI_MODEL:-${LLM_MODEL}}
      CONVERSATION_AI_MAX_TOKENS: ${CONVERSATION_AI_MAX_TOKENS:-${LLM_MAX_TOKENS:-4096}}
      WORK_ASSISTANT_MODEL: ${WORK_ASSISTANT_MODEL:-${LLM_MODEL}}
      WORK_ASSISTANT_MAX_TOKENS: ${WORK_ASSISTANT_MAX_TOKENS:-1800}
      MEETING_SUMMARY_MODEL: ${MEETING_SUMMARY_MODEL:-${LLM_MODEL}}
      MEETING_SUMMARY_MAX_TOKENS: ${MEETING_SUMMARY_MAX_TOKENS:-${LLM_MAX_TOKENS:-4096}}
      AI_TO_COMMUNICATION_KEY: ${AI_TO_COMMUNICATION_KEY:-}
      COMMUNICATION_TO_AI_KEY: ${COMMUNICATION_TO_AI_KEY:-}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL:-}
      WORK_ASSISTANT_ENABLED: ${WORK_ASSISTANT_ENABLED:-false}
      AI_TO_PROJECT_KEY: ${AI_TO_PROJECT_KEY:-}
      AI_TO_CALENDAR_KEY: ${AI_TO_CALENDAR_KEY:-}
      WORK_ASSISTANT_PROJECT_URL: ${WORK_ASSISTANT_PROJECT_URL:-}
      WORK_ASSISTANT_CALENDAR_URL: ${WORK_ASSISTANT_CALENDAR_URL:-}
      PORT: ${PORT:-8087}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_SHUTDOWN_TIMEOUT_MS: ${AI_SHUTDOWN_TIMEOUT_MS:-210000}
      CHAT_CANCEL_POLL_MS: ${CHAT_CANCEL_POLL_MS:-2000}
      NODE_ENV: ${NODE_ENV:-development}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NOTEBOOK_INDEX_CONCURRENCY: ${NOTEBOOK_INDEX_CONCURRENCY:-1}
      NOTEBOOK_INDEX_TIMEOUT_MS: ${NOTEBOOK_INDEX_TIMEOUT_MS:-240000}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      AI_GATEWAY_KEY_PREVIOUS: ${AI_GATEWAY_KEY_PREVIOUS:-}
      AI_DOCUMENT_SERVICE_KEY: ${AI_DOCUMENT_SERVICE_KEY:-}
      RAG_SERVICE_KEY: ${RAG_SERVICE_KEY:-}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:?DOCUMENT_SERVICE_URL is required}
      RAG_WORKER_URL: ${RAG_WORKER_URL:?RAG_WORKER_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      VISUAL_ENABLED: ${VISUAL_ENABLED:-false}
