# Infrastructure and gateway only; application services run on the host.
# Preserve the legacy project/volume names used by existing local installations.
name: docker

include:
  - path: ../livekit/docker-compose.yml

services:
  kong:
    build:
      context: ../kong-gateway
      dockerfile: Dockerfile.production
    container_name: wh_kong
    env_file:
      - ../kong-gateway/.env
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PLUGINS: bundled,jwt-user-context
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - '127.0.0.1:8000:8000'
      - '127.0.0.1:8443:8443'
      - '127.0.0.1:8001:8001'
      - '127.0.0.1:8444:8444'
    volumes:
      # The current image renders this template safely at startup.
      - ../kong-gateway/kong.host.yml:/usr/local/kong/declarative/kong.template.yml:ro
    networks: [wh_network]
    healthcheck:
      test: [CMD, kong, health]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: on-failure

  postgres:
    image: postgres:15.18-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    container_name: wh_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_hub}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../deploy/shared/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [wh_network]
    restart: always

  redis:
    image: redis:7.4.8-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    container_name: wh_redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [wh_network]
    restart: always

  kafka:
    image: &kafka-image apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: wh_kafka
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [wh_network]
    restart: always

  kafka-init:
    image: *kafka-image
    container_name: wh_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: [/bin/sh, /init-topics.sh]
    volumes:
      - ../../deploy/shared/kafka/init-topics.sh:/init-topics.sh:ro
    networks: [wh_network]
    restart: 'no'

volumes:
  postgres_data: {}
  redis_data: {}

networks:
  wh_network:
    name: wh_network
    driver: bridge
