version: '3.8'

include:
  - path: ../user-service/docker-compose.yml
  - path: ../project-service/docker-compose.stack.yml
  - path: ../communication-service/docker-compose.yml
  - path: ../document-service/docker-compose.yml
  - path: ../calendar-service/docker-compose.yml
  - path: ../notification-service/docker-compose.yml
  - path: ../../frontend/web/docker-compose.yml

services:
  kong:
    build: 
      context: ../kong-gateway
      dockerfile: Dockerfile
    container_name: wh_kong
    env_file:
      - ../kong-gateway/.env
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/tmp/kong.yml
      - KONG_PLUGINS=bundled,jwt-user-context
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
    command: >
      /bin/sh -c "
      sed -e \"s|[$$]FRONTEND_URL|$${FRONTEND_URL}|g\" -e \"s|[$$]JWT_SECRET_KEY|$${JWT_SECRET_KEY}|g\" /usr/local/kong/declarative/kong.yml > /tmp/kong.yml &&
      /docker-entrypoint.sh kong docker-start"
    ports:
      - "8000:8000" # Proxy HTTP Port
      - "8443:8443" # Proxy HTTPS Port
      - "8001:8001" # Admin HTTP Port
      - "8444:8444" # Admin HTTPS Port
    volumes:
      - ../kong-gateway/kong.docker.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      calendar-service:
        condition: service_healthy
    networks:
      - wh_network
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    container_name: wh_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_hub}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wh_network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: wh_redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wh_network
    restart: always

  kafka:
    image: apache/kafka:latest
    container_name: wh_kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - wh_network
    restart: always

  kafka-init:
    image: apache/kafka:latest
    container_name: wh_kafka_init
    depends_on:
      - kafka
    command: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...' &&
      sleep 10 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic notification-topic --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic user-profile-events --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic calendar-reminder-events --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic project-task-events --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics created successfully.'
      "
    networks:
      - wh_network


volumes:
  postgres_data:
  redis_data:

networks:
  wh_network:
    name: wh_network
    driver: bridge
