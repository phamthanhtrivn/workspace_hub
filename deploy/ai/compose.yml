name: wh-notebook
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  notebook-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notebook
      POSTGRES_DB: notebook_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure deploy/ai/.env first}
    volumes: [notebook-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U notebook -d notebook_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  notebook-redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [notebook-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  notebook-qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes: [notebook-qdrant:/qdrant/storage]
    restart: unless-stopped
  rag-worker:
    build: ../../backend/rag-worker
    # Only the worker's own credential and model settings; never gateway, LLM or DB secrets.
    environment:
      RAG_SERVICE_KEY: ${RAG_SERVICE_KEY:?Configure dedicated RAG credentials first}
      RAG_SERVICE_KEY_PREVIOUS: ${RAG_SERVICE_KEY_PREVIOUS:-}
      QDRANT_URL: ${QDRANT_URL:-http://notebook-qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      INDEX_PIPELINE_VERSION: ${INDEX_PIPELINE_VERSION:-notebook-v1}
      VISUAL_ENABLED: ${VISUAL_ENABLED:-false}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
    volumes: [notebook-models:/models]
    depends_on: [notebook-qdrant]
    restart: unless-stopped
    mem_limit: ${RAG_MEMORY_LIMIT:-2g}
    logging: *bounded-logs
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8088/ready',headers={'x-internal-service-key':os.environ['RAG_SERVICE_KEY']}); urllib.request.urlopen(r,timeout=10).close()"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 180s
  migrate:
    build: ../../backend/ai-service
    env_file: .env
    command: [node, dist/migrate.js]
    depends_on:
      notebook-db: { condition: service_healthy }
    restart: "no"
  notebook-api:
    build: ../../backend/ai-service
    env_file: .env
    ports: ["127.0.0.1:8087:8087"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, workspace]
    depends_on:
      migrate: { condition: service_completed_successfully }
      notebook-redis: { condition: service_healthy }
      rag-worker: { condition: service_healthy }
    restart: unless-stopped
    logging: *bounded-logs
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8087/ready',{signal:AbortSignal.timeout(8000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
  notebook-jobs:
    build: ../../backend/ai-service
    env_file: .env
    command: [node, dist/worker.js]
    # Let active model calls checkpoint and deliver before Docker stops the worker.
    stop_grace_period: 4m
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, workspace]
    depends_on:
      migrate: { condition: service_completed_successfully }
      notebook-redis: { condition: service_healthy }
      rag-worker: { condition: service_healthy }
    restart: unless-stopped
    logging: *bounded-logs
volumes:
  notebook-postgres:
  notebook-redis:
  notebook-qdrant:
  notebook-models:
networks:
  workspace:
    name: wh_network
    external: true
